<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TourneyDecks</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#FFD700">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #0a0a14;
            background-image: radial-gradient(ellipse at top, #1a0533 0%, #0a0a14 70%);
            color: white;
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .logo {
            font-size: 4em;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 2.5em;
            background: linear-gradient(135deg, #FFD700, #FF6B35);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitulo {
            color: rgba(255,255,255,0.5);
            margin-bottom: 50px;
            font-size: 1.1em;
            text-align: center;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 400px;
        }

        .menu-btn {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 20px 25px;
            border-radius: 16px;
            text-decoration: none;
            font-size: 1.1em;
            font-weight: bold;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .menu-btn .icono {
            font-size: 1.8em;
        }

        .menu-btn .texto h3 {
            font-size: 1em;
            margin-bottom: 3px;
        }

        .menu-btn .texto p {
            font-size: 0.8em;
            opacity: 0.7;
            font-weight: normal;
        }

        .btn-aleatorizar {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-color: rgba(155, 48, 255, 0.4);
            color: white;
        }

        .btn-aleatorizar:hover {
            border-color: #9b30ff;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(155, 48, 255, 0.3);
        }

        .btn-torneo {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-color: rgba(255, 215, 0, 0.4);
            color: white;
        }

        .btn-torneo:hover {
            border-color: gold;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.3);
        }

        .btn-registro {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-color: rgba(255, 107, 53, 0.4);
            color: white;
        }

        .btn-registro:hover {
            border-color: #FF6B35;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 107, 53, 0.3);
        }

        .version {
            margin-top: 40px;
            color: rgba(255,255,255,0.2);
            font-size: 0.8em;
        }
    </style>
</head>
<body>

    <div class="logo">🎴</div>
    <h1>TourneyDecks</h1>
    <p class="subtitulo">Organiza tu torneo de cartas</p>

    <nav class="menu">
        <a href="/aleatorizar.html" class="menu-btn btn-aleatorizar">
            <span class="icono">🎲</span>
            <div class="texto">
                <h3>Aleatorizar Decks</h3>
                <p>Asigna decks al azar a los jugadores</p>
            </div>
        </a>

        <a href="/torneo.html" class="menu-btn btn-torneo">
            <span class="icono">🏆</span>
            <div class="texto">
                <h3>Realizar Torneo</h3>
                <p>Eliminación directa, Round Robin o Suizo</p>
            </div>
        </a>

        <a href="/registro.html" class="menu-btn btn-registro">
            <span class="icono">👥</span>
            <div class="texto">
                <h3>Registrar Jugadores y Decks</h3>
                <p>Gestiona tu lista de jugadores y decks</p>
            </div>
        </a>
    </nav>

    <p class="version">TourneyDecks v1.0</p>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js')
                .then(() => console.log('Service Worker registrado'))
                .catch(err => console.log('Error:', err));
        }
    </script>

</body>
</html>
