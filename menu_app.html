<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Torneo de Decks</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0f0f1a;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        h1 { color: gold; text-align: center; margin-bottom: 20px; }
        section {
            background: #1a1a2e;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,215,0,0.2);
        }
        h2 { color: gold; margin-bottom: 15px; }
        input, select {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,215,0,0.3);
            border-radius: 8px;
            padding: 10px;
            color: white;
            width: 100%;
            margin-bottom: 10px;
        }
        button {
            background: purple;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            cursor: pointer;
            width: 100%;
            margin-top: 5px;
        }
        button:hover { background: darkviolet; }
        .tarjeta {
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 10px 15px;
            margin: 8px 0;
            border-left: 3px solid gold;
        }
        .contenedor {
        max-width: 1100px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        }

.ancho-completo {
    grid-column: 1 / -1;
}


    </style>
</head>
<body>
    <h1>Vamo' a juga'!!</h1>
    <div class="contenedor">

    <section>
        <h2>➕ Agregar Jugador</h2>
        <input type="text" id="input-nombre" placeholder="Nombre del jugador">
        <button onclick="agregarJugador()">+ Agregar</button>
    </section>
<section>
    <h2>➕ Agregar Deck</h2>
    <input type="text" id="input-deck-nombre" placeholder="Nombre del deck">
    <input type="text" id="input-deck-tcg" placeholder="TCG (Magic, Pokémon...)">
    <button onclick="agregarDeck()">+ Agregar Deck</button>
</section>

    <section>
        <h2>👥 Jugadores Registrados</h2>
        <div id="lista-jugadores">
            <p>No hay jugadores registrados.</p>
        </div>
    </section>

    <section>
        <h2>🃏 Decks Disponibles</h2>
        <select id="select-tcg" onchange="mostrarDecksDisponibles()">
        </select>
        <div id="lista-decks"></div>
    </section>

    <section>
        <h2>🎲 Asignar Decks</h2>
        <button onclick="asignarDecks()">🎲 Asignar Decks al azar</button>
    </section>

    <section class="ancho-completo">
        <h2>🏆 Resultados</h2>
        <div id="lista-resultados">
            <p>Aún no se han asignado decks.</p>
        </div>
    </section>

    
    </div>

    <script>
        let jugadores = [];
        let decksDisponibles = {};

        // ===== CARGAR DATOS DEL SERVIDOR =====
        async function cargarDecks() {
            try {
                let respuesta = await fetch('/decks');
                let decks = await respuesta.json();
                console.log("Decks recibidos:", decks);

                decks.forEach(deck => {
                    if (!decksDisponibles[deck.tcg]) {
                        decksDisponibles[deck.tcg] = [];
                    }
                    decksDisponibles[deck.tcg].push(deck.nombre);
                });

                let select = document.getElementById("select-tcg");
                select.innerHTML = "";
                Object.keys(decksDisponibles).forEach(tcg => {
                    let opcion = document.createElement("option");
                    opcion.value = tcg;
                    opcion.textContent = tcg;
                    select.appendChild(opcion);
                });

                mostrarDecksDisponibles();
            } catch (error) {
                console.error("Error cargando decks:", error);
            }
        }

        async function cargarJugadores() {
            try {
                let respuesta = await fetch('/jugadores');
                jugadores = await respuesta.json();
                mostrarJugadores();
            } catch (error) {
                console.error("Error cargando jugadores:", error);
            }
        }

        // ===== JUGADORES =====
        async function agregarJugador() {
            let input = document.getElementById("input-nombre");
            let nombre = input.value.trim();

            if (nombre === "") {
                alert("Por favor escribe un nombre.");
                return;
            }

            let respuesta = await fetch('/jugadores', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nombre })
            });

            let datos = await respuesta.json();
            jugadores = datos.jugadores;
            input.value = "";
            mostrarJugadores();
        }

        async function eliminarJugador(nombre) {
            await fetch(`/jugadores/${nombre}`, { method: 'DELETE' });
            jugadores = jugadores.filter(j => j.nombre !== nombre);
            mostrarJugadores();
        }

        function mostrarJugadores() {
            let lista = document.getElementById("lista-jugadores");

            if (jugadores.length === 0) {
                lista.innerHTML = "<p>No hay jugadores registrados.</p>";
                return;
            }

            lista.innerHTML = "";
            jugadores.forEach(jugador => {
                let tarjeta = document.createElement("div");
                tarjeta.className = "tarjeta";
                tarjeta.innerHTML = `
                    <span>${jugador.nombre}</span>
                    <button onclick="eliminarJugador('${jugador.nombre}')" 
                        style="width:auto; background:#8B0000; padding:5px 10px; margin:0; float:right">
                        ✕
                    </button>
                `;
                lista.appendChild(tarjeta);
            });
        }

        // ===== DECKS =====
        function mostrarDecksDisponibles() {
    let tcg = document.getElementById("select-tcg").value;
    let decks = decksDisponibles[tcg];
    let lista = document.getElementById("lista-decks");

    lista.innerHTML = "";
    if (!decks) return;

    decks.forEach(deck => {
        let item = document.createElement("div");
        item.className = "tarjeta";
        item.innerHTML = `
            <span>🃏 ${deck}</span>
            <button onclick="eliminarDeck('${deck}')" 
                style="width:auto; background:#8B0000; padding:5px 10px; margin:0; float:right">
                ✕
            </button>
        `;
        lista.appendChild(item);
    });
}

        // ===== ASIGNAR =====
        async function asignarDecks() {
            if (jugadores.length === 0) {
                alert("Agrega jugadores primero.");
                return;
            }

            let tcg = document.getElementById("select-tcg").value;

            let respuesta = await fetch('/jugadores/asignar', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tcg })
            });

            if (!respuesta.ok) {
                let error = await respuesta.json();
                alert(error.error);
                return;
            }

            let datos = await respuesta.json();
            jugadores = datos.jugadores;
            mostrarResultados();
        }

        function mostrarResultados() {
            let lista = document.getElementById("lista-resultados");
            lista.innerHTML = "";

            jugadores.forEach(jugador => {
                let item = document.createElement("div");
                item.className = "tarjeta";
                item.innerHTML = `
                    <span style="color:#9b30ff">👤 ${jugador.nombre}</span>
                    <span> juega con  </span>
                    <span style="color:gold">🃏 ${jugador.deck}</span>
                `;
                lista.appendChild(item);
            });
        }

        async function agregarDeck() {
    let nombre = document.getElementById("input-deck-nombre").value.trim();
    let tcg = document.getElementById("input-deck-tcg").value.trim();

    if (nombre === "" || tcg === "") {
        alert("Por favor llena todos los campos.");
        return;
    }

    let respuesta = await fetch('/decks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nombre, tcg })
    });

    document.getElementById("input-deck-nombre").value = "";
    document.getElementById("input-deck-tcg").value = "";

    decksDisponibles = {};
    await cargarDecks();
}

async function eliminarDeck(nombre) {
    await fetch(`/decks/${nombre}`, { method: 'DELETE' });
    decksDisponibles = {};
    await cargarDecks();
}

        // ===== INICIAR =====
        console.log("Iniciando app...");
        cargarDecks();
        cargarJugadores();
    </script>
</body>
</html>
